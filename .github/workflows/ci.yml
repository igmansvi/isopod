name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Build, Lint, and Typecheck
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: "mock-secret-for-ci-builds-only-replace-in-production"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/isopod?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript Compilation
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
