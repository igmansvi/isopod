events {
    # Maximum number of simultaneous connections per worker.
    worker_connections 1024;
}

http {
    server {
        # Listen for incoming HTTP traffic.
        listen 80;
        # Hostname served by this server block.
        server_name localhost;

        location / {
            # Forward all requests to the isopod application container.
            proxy_pass http://isopod:3000;
            # Preserve the original host header.
            proxy_set_header Host $host;
            # Pass the client's real IP address.
            proxy_set_header X-Real-IP $remote_addr;
            # Forward the full client IP chain.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket support for terminal
            # Use HTTP/1.1 so WebSocket upgrades are supported.
            proxy_http_version 1.1;
            # Tell the upstream to upgrade the connection when requested.
            proxy_set_header Upgrade $http_upgrade;
            # Keep the upgraded connection open.
            proxy_set_header Connection "upgrade";
            # Allow long-lived connections for terminal sessions.
            proxy_read_timeout 86400;
        }
    }
}
