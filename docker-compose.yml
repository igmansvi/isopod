services:
  # PostgreSQL database for Isopod.
  postgres:
    image: postgres:alpine
    container_name: isopod_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: isopod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isopod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Main Isopod application.
  isopod:
    build: .
    container_name: isopod
    ports:
      - "3000:3000"
    environment:
      # Database connection string.
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/isopod?schema=public
      # NextAuth settings for local development.
      - NEXTAUTH_SECRET=isopod@m4vi
      - NEXTAUTH_URL=http://localhost
      
      # Absolute path to the Windows host workspaces directory.
      - HOST_WORKSPACES_ROOT=D:/isopod/workspaces
    volumes:
      # Docker socket mount for container management.
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace files mount.
      - ./workspaces:/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Nginx reverse proxy.
  nginx:
    image: nginx:alpine
    container_name: isopod_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - isopod
    restart: unless-stopped

volumes:
  # Persistent PostgreSQL data volume.
  postgres_data:
