<div class="h-screen w-full flex flex-col bg-neutral-950 text-neutral-50 overflow-hidden relative">
  
  <!-- Editor Top Bar -->
  <header class="h-12 border-b border-neutral-800 bg-neutral-900 flex items-center px-4 justify-between shrink-0 relative z-20">
    <div class="flex items-center space-x-4">
      <a routerLink="/dashboard" class="text-neutral-400 hover:text-white transition-colors p-1 rounded hover:bg-neutral-800">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </a>
      <div class="flex flex-col">
        <span class="text-sm font-medium text-white flex items-center gap-2">
          {{ environment?.name || 'Workspace' }}
          <span class="inline-block w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
        </span>
      </div>
    </div>
    
    <div class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center">
      <div *ngIf="isSaving()" class="flex items-center gap-2 px-3 py-1 bg-black border border-white text-white text-xs font-bold animate-pulse">
        <svg class="animate-spin h-3 w-3 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Saving...
      </div>
      
      <div *ngIf="saveSuccess() && !isSaving()" class="flex items-center gap-1.5 px-3 py-1 bg-black border border-[#00c853] text-[#00c853] text-xs font-bold transition-opacity duration-300">
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Saved
      </div>
    </div>

    <div class="flex items-center text-xs text-neutral-500 font-mono">
      editor
    </div>
  </header>

  <!-- Editor Main Area -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- File Explorer Sidebar -->
    <app-file-tree 
      *ngIf="envId"
      [envId]="envId"
      (fileSelected)="onFileSelected($event)"
      (fileDeleted)="onFileDeleted($event)">
    </app-file-tree>

    <!-- Main Content Split (Code Editor Top, Terminal Bottom) -->
    <section class="flex-1 flex flex-col bg-[#1e1e1e] relative min-w-0">
      
      <!-- Code Editor Area -->
      <div class="flex-1 flex flex-col relative min-h-[50%]">
        <div *ngIf="selectedFile()" class="h-9 bg-[#1e1e1e] border-b border-[#2d2d2d] flex items-center px-4">
          <span class="text-xs font-mono" [ngClass]="hasUnsavedChanges() ? 'text-amber-400' : 'text-neutral-400'">
            {{ selectedFile() }} <span *ngIf="hasUnsavedChanges()">*</span>
          </span>
        </div>
        <div class="flex-1 relative">
          <app-code-editor 
            *ngIf="selectedFile()"
            [content]="fileContent()"
            (contentChanged)="onContentChanged($event)"
            (saveRequested)="onSaveRequested($event)"
            class="absolute inset-0">
          </app-code-editor>
          
          <div *ngIf="!selectedFile()" class="absolute inset-0 flex flex-col items-center justify-center text-neutral-600 select-none">
            <svg class="w-16 h-16 mb-4 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
            <p class="text-sm">Select a file from the explorer to begin editing.</p>
          </div>
        </div>
      </div>

      <!-- Terminal Resizer Handle -->
      <div class="h-1 bg-[#2d2d2d] cursor-row-resize hover:bg-blue-500 transition-colors z-10 shrink-0"></div>

      <!-- Terminal Area -->
      <div class="h-[35%] min-h-[100px] flex flex-col shrink-0 bg-[#0d0d0d] relative">
        <div class="h-8 bg-[#181818] border-b border-[#2d2d2d] flex items-center px-4">
          <span class="text-xs text-neutral-400 font-mono flex items-center gap-2">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            Terminal
          </span>
        </div>
        <app-terminal *ngIf="envId" [envId]="envId" class="flex-1 w-full relative"></app-terminal>
      </div>
      
    </section>

  </main>
</div>
