# ==============================================================================
# Isopod Nginx Configuration
#
# Functions as the primary ingress controller for the All-in-One container.
# Serves the compiled Angular static assets and reverse-proxies REST API and
# WebSocket traffic directly to the internal Spring Boot backend on port 8080.
# ==============================================================================

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;

    server {
        listen 80;
        server_name localhost;

        root /app/client;
        index index.html;

        # ==============================================================================
        # REST API Gateway
        # Proxies all authenticated HTTP traffic to the internal Spring Boot instance.
        # ==============================================================================
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==============================================================================
        # WebSocket Terminal Gateway
        # Upgrades HTTP connections for bidirectional xterm.js TTY streaming.
        # ==============================================================================
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # ==============================================================================
        # SPA Asset Gateway
        # Serves compiled Angular artifacts and routes unknowns to index.html.
        # ==============================================================================
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
