; ==============================================================================
; Isopod Supervisord Configuration
;
; Orchestrates the initialization and lifecycle of all internal services within
; the All-in-One container. Strict priorities are defined to guarantee the
; database and cache layers are available before the Spring Boot backend boots.
; ==============================================================================

[program:postgresql]
command=postgres -D /data/postgresql
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --dir /data/redis --daemonize no
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:spring-boot]
command=java -jar /app/server/app.jar
autostart=true
autorestart=true
priority=30
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/isopod",SPRING_DATASOURCE_USERNAME="m4vi",SPRING_DATASOURCE_PASSWORD="isopod@m4vi",REDIS_HOST="localhost",WORKSPACE_ROOT="/workspaces",WORKSPACE_HOST="%(ENV_WORKSPACE_HOST)s",DOCKER_HOST="unix:///var/run/docker.sock"

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
